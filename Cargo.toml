[workspace]
resolver = "3"
members = ["crates/snowblog-core", "crates/snowblog-server", "crates/snowblog"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/SnowballSH/snowblog"

[workspace.dependencies]
snowblog-core = { path = "crates/snowblog-core" }
snowblog-server = { path = "crates/snowblog-server" }
anyhow = "1"
axum = "0.8"
blake3 = "1"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
constant_time_eq = "0.5"
jiff = { version = "0.2", features = ["serde"] }
oxilangtag = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite", "migrate"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["trace", "limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
typst = "=0.15.1"
typst-assets = { version = "=0.15.1", features = ["fonts"] }
typst-html = "=0.15.1"
typst-kit = { version = "=0.15.1", default-features = false, features = ["embedded-fonts", "scan-fonts"] }
typst-syntax = "=0.15.1"
uuid = { version = "1", features = ["v7", "serde"] }
