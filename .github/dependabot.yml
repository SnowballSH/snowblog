version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    groups:
      compatible:
        applies-to: version-updates
        update-types:
          - minor
          - patch
  - package-ecosystem: bun
    directories:
      - "/web"
      - "/web-admin"
    schedule:
      interval: weekly
    groups:
      compatible:
        applies-to: version-updates
        update-types:
          - minor
          - patch
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
