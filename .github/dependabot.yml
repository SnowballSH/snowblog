version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    groups:
      compatible:
        applies-to: version-updates
        update-types:
          - minor
          - patch
  - package-ecosystem: bun
    directories:
      - "/web"
      - "/web-admin"
    schedule:
      interval: weekly
    groups:
      compatible:
        applies-to: version-updates
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        versions: [">=25"]
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    ignore:
      - dependency-name: library/node
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
