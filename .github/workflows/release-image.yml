name: release-image

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/snowballsh/snowblog
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build
        run: |
          docker build \
            --build-arg SOURCE_COMMIT="${GITHUB_SHA}" \
            -f Containerfile \
            -t "${IMAGE}:sha-${GITHUB_SHA}" .

      - name: Smoke test
        shell: bash
        run: |
          smoke_name="snowblog-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            docker rm -f "${smoke_name}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker run -d \
            --name "${smoke_name}" \
            --env SNOWBLOG_METRICS_LISTEN=0.0.0.0:9090 \
            -p 127.0.0.1:18080:8080 \
            -p 127.0.0.1:19090:9090 \
            "${IMAGE}:sha-${GITHUB_SHA}"
          for _ in $(seq 30); do
            if curl --connect-timeout 1 --max-time 2 -fs \
              http://127.0.0.1:18080/api/v1/health >/dev/null \
              && curl --connect-timeout 1 --max-time 2 -fs \
                http://127.0.0.1:19090/metrics >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --connect-timeout 2 --max-time 5 -fs \
            http://127.0.0.1:18080/api/v1/health | tee /tmp/health.json
          grep -q '"database":"ok"' /tmp/health.json
          status="$(curl --connect-timeout 2 --max-time 5 -s \
            -o /dev/null -w '%{http_code}' \
            http://127.0.0.1:18080/api/v1/admin/posts)"
          test "${status}" = "404"
          status="$(curl --connect-timeout 2 --max-time 5 -s \
            -o /dev/null -w '%{http_code}' \
            http://127.0.0.1:18080/metrics)"
          test "${status}" = "404"
          curl --connect-timeout 2 --max-time 5 -fsS \
            -D /tmp/metrics-headers.txt \
            http://127.0.0.1:19090/metrics \
            -o /tmp/metrics.txt
          grep -qi '^content-type: text/plain; version=0.0.4; charset=utf-8' /tmp/metrics-headers.txt
          grep -q '^snowblog_build_info{' /tmp/metrics.txt
          grep -q '^snowblog_content_posts{' /tmp/metrics.txt

      - name: Push
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          docker tag "${IMAGE}:sha-${GITHUB_SHA}" "${IMAGE}:latest"
          docker push "${IMAGE}:sha-${GITHUB_SHA}"
          docker push "${IMAGE}:latest"

      - name: Record the registry digest
        if: github.event_name != 'pull_request'
        run: |
          token="$(curl -fs 'https://ghcr.io/token?scope=repository:snowballsh/snowblog:pull' | jq -r .token)"
          digest="$(curl -fsI \
            -H "Authorization: Bearer ${token}" \
            -H 'Accept: application/vnd.oci.image.manifest.v1+json, application/vnd.oci.image.index.v1+json' \
            "https://ghcr.io/v2/snowballsh/snowblog/manifests/sha-${GITHUB_SHA}" |
            awk 'tolower($1)=="docker-content-digest:" {print $2}' | tr -d '\r')"
          {
            echo "### snowblog image"
            echo ""
            echo '```'
            echo "ghcr.io/snowballsh/snowblog@${digest}"
            echo '```'
            echo ""
            echo "Built from commit ${GITHUB_SHA}. Pin this digest in the next deployment revision."
          } >> "${GITHUB_STEP_SUMMARY}"

  web-image:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/snowballsh/snowblog-web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build
        run: |
          docker build \
            --build-arg SOURCE_COMMIT="${GITHUB_SHA}" \
            -f Containerfile.web \
            -t "${IMAGE}:sha-${GITHUB_SHA}" .

      - name: Smoke test
        run: |
          docker run -d --name smoke -p 127.0.0.1:8091:3000 \
            -e SNOWBLOG_API_URL=http://127.0.0.1:9 \
            -e ORIGIN=http://127.0.0.1:8091 \
            "${IMAGE}:sha-${GITHUB_SHA}"
          for _ in $(seq 30); do
            if curl -fs http://127.0.0.1:8091/robots.txt >/dev/null; then break; fi
            sleep 1
          done
          curl -fs http://127.0.0.1:8091/robots.txt | grep -q 'Sitemap:'
          status="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8091/)"
          test "${status}" = "502"
          curl -s http://127.0.0.1:8091/ | grep -q 'Something went wrong upstream.'
          docker rm -f smoke

      - name: Push
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          docker tag "${IMAGE}:sha-${GITHUB_SHA}" "${IMAGE}:latest"
          docker push "${IMAGE}:sha-${GITHUB_SHA}"
          docker push "${IMAGE}:latest"

      - name: Record the registry digest
        if: github.event_name != 'pull_request'
        run: |
          token="$(curl -fs 'https://ghcr.io/token?scope=repository:snowballsh/snowblog-web:pull' | jq -r .token)"
          digest="$(curl -fsI \
            -H "Authorization: Bearer ${token}" \
            -H 'Accept: application/vnd.oci.image.manifest.v1+json, application/vnd.oci.image.index.v1+json' \
            "https://ghcr.io/v2/snowballsh/snowblog-web/manifests/sha-${GITHUB_SHA}" |
            awk 'tolower($1)=="docker-content-digest:" {print $2}' | tr -d '\r')"
          {
            echo "### snowblog-web image"
            echo ""
            echo '```'
            echo "ghcr.io/snowballsh/snowblog-web@${digest}"
            echo '```'
            echo ""
            echo "Built from commit ${GITHUB_SHA}. Pin this digest in the next deployment revision."
          } >> "${GITHUB_STEP_SUMMARY}"

  image-admin:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/snowballsh/snowblog-admin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Build
        run: |
          docker build \
            --build-arg SOURCE_COMMIT="${GITHUB_SHA}" \
            -f Containerfile.admin \
            -t "${IMAGE}:sha-${GITHUB_SHA}" .

      - name: Smoke test
        shell: bash
        run: |
          smoke_name="snowblog-admin-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          token_file="$(mktemp)"
          echo "smoke-token" > "${token_file}"
          chmod 644 "${token_file}"
          fixture_log="$(mktemp)"
          bun web-admin/scripts/fixture-admin-api.ts > "${fixture_log}" 2>&1 &
          fixture_pid=$!
          cleanup() {
            docker rm -f "${smoke_name}" >/dev/null 2>&1 || true
            kill "${fixture_pid}" >/dev/null 2>&1 || true
            rm -f "${token_file}" "${fixture_log}"
          }
          trap cleanup EXIT
          fixture_port=""
          for _ in $(seq 30); do
            fixture_port="$(grep -o 'http://127.0.0.1:[0-9]*' "${fixture_log}" |
              head -1 | grep -o '[0-9]*$' || true)"
            if [ -n "${fixture_port}" ]; then break; fi
            sleep 0.2
          done
          test -n "${fixture_port}"
          docker run -d \
            --name "${smoke_name}" \
            --add-host=host.docker.internal:host-gateway \
            -v "${token_file}:/run/admin-token:ro" \
            --env SNOWBLOG_API_URL="http://host.docker.internal:${fixture_port}" \
            --env SNOWBLOG_ADMIN_TOKEN_FILE=/run/admin-token \
            --env ADMIN_ALLOWED_USERS=smoke \
            --env ORIGIN=http://127.0.0.1:8092 \
            --env SNOWBLOG_ADMIN_METRICS_LISTEN=0.0.0.0:9464 \
            -p 127.0.0.1:8092:3000 \
            -p 127.0.0.1:19464:9464 \
            "${IMAGE}:sha-${GITHUB_SHA}"
          for _ in $(seq 30); do
            if curl --connect-timeout 1 --max-time 2 -fs \
              http://127.0.0.1:8092/healthz >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --connect-timeout 2 --max-time 5 -fs \
            http://127.0.0.1:8092/healthz | tee /tmp/admin-healthz.json
          grep -q '"status":"ok"' /tmp/admin-healthz.json
          status="$(curl --connect-timeout 2 --max-time 5 -s \
            -o /dev/null -w '%{http_code}' \
            http://127.0.0.1:8092/)"
          test "${status}" = "403"
          status="$(curl --connect-timeout 2 --max-time 5 -s \
            -o /dev/null -w '%{http_code}' \
            -H 'Remote-User: smoke' \
            http://127.0.0.1:8092/)"
          test "${status}" = "200"
          curl --connect-timeout 2 --max-time 5 -fs \
            http://127.0.0.1:19464/metrics | tee /tmp/admin-metrics.txt
          grep -q 'snowblog_admin_' /tmp/admin-metrics.txt

      - name: Push
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          docker tag "${IMAGE}:sha-${GITHUB_SHA}" "${IMAGE}:latest"
          docker push "${IMAGE}:sha-${GITHUB_SHA}"
          docker push "${IMAGE}:latest"

      - name: Record the registry digest
        if: github.event_name != 'pull_request'
        run: |
          token="$(curl -fs 'https://ghcr.io/token?scope=repository:snowballsh/snowblog-admin:pull' | jq -r .token)"
          digest="$(curl -fsI \
            -H "Authorization: Bearer ${token}" \
            -H 'Accept: application/vnd.oci.image.manifest.v1+json, application/vnd.oci.image.index.v1+json' \
            "https://ghcr.io/v2/snowballsh/snowblog-admin/manifests/sha-${GITHUB_SHA}" |
            awk 'tolower($1)=="docker-content-digest:" {print $2}' | tr -d '\r')"
          {
            echo "### snowblog-admin image"
            echo ""
            echo '```'
            echo "ghcr.io/snowballsh/snowblog-admin@${digest}"
            echo '```'
            echo ""
            echo "Built from commit ${GITHUB_SHA}. Pin this digest in the next deployment revision."
          } >> "${GITHUB_STEP_SUMMARY}"
